<div class="card"><h2>Bodyweight (${D.set.bw})</h2>${chart(D.bw.filter(x=>x.date>=r0).map(x=>({x:x.date.slice(5),y:n1(ub(x.v))})),{t:'line'})}</div>
<div class="card"><h2>Protein per day (target ${D.set.pt}g)</h2>${chart(dp.map(q=>({x:q.x.slice(5),y:q.y})),{ref:D.set.pt})}<p class="m">${dp.length?`Target hit on ${hit} of ${dp.length} logged days. Days with no entry are not counted.`:''}</p></div>
<div class="card"><h2>Training days per muscle group</h2>${bars(fr,mx)}<h2 style="margin-top:14px">Monthly comparison — sets (${mname(pM)} → ${mname(M)})</h2>${MG.map(m=>`<div class="row sp ex" style="padding:7px 0"><span>${m}</span><span class="m">${cm(pM).filter(x=>x.mg==m).length} → <b style="color:var(--t)">${cm(M).filter(x=>x.mg==m).length}</b></span></div>`).join('')}</div>
<div class="card"><h2>Personal records timeline</h2>${pl.map(p=>`<div class="ex row sp"><div><b>${esc(p.ex)}</b><div class="m">${isBW(p.ex)?p.r+' reps':sw(p.w)+' × '+p.r}</div></div><span class="m">${dl(p.d)}</span></div>`).join('')||emp('A PR is logged when a set beats your previous best for that exercise. The first set is a baseline, not a PR.')}</div>`}
/* ---------- MONTHLY REPORT ---------- */
function vRp(){const months=[...new Set([todayS().slice(0,7),...D.ss.map(s=>s.date.slice(0,7))])].sort().reverse(),M=months.includes(rm)?rm:months[0];return `<h1 style="margin-bottom:12px">Monthly report</h1><div class="row"><select onchange="rm=this.value;D.seen[rm]=1;save();render()">${months.map(m=>`<option value="${m}" ${m==M?'selected':''}>${mname(m)}${m==todayS().slice(0,7)?' (so far)':''}</option>`).join('')}</select><button class="btn" onclick="render()">Generate</button></div><div style="margin-top:12px">${report(M)}</div>`}
const pc=(a,b)=>b>0?` (${a>=b?'+':''}${Math.round((a/b-1)*100)}%)`:' (no previous data)';
function report(M){const a1=M+'-01',e=lastDay(M),b1=e>todayS()?todayS():e,pm=addM(M,-1),a0=pm+'-01',b0=lastDay(pm),w1=Math.max(1,(diff(b1,a1)+1)/7),w0=(diff(b0,a0)+1)/7,W=[...WD()],c1=W.filter(d=>inR(d,a1,b1)).length,c0=W.filter(d=>inR(d,a0,b0)).length,sug=[];
if(!S().some(x=>inR(x.d,a1,b1)))return emp(`No completed sets recorded in ${mname(M)}. Nothing can be assessed — log workouts and generate again.`);
const mgs=MG.map(m=>{const c=S().filter(x=>x.mg==m&&inR(x.d,a1,b1)),p=S().filter(x=>x.mg==m&&inR(x.d,a0,b0)),dc=dset(c),dp=dset(p),exs=[...new Set([...c,...p].map(x=>x.ex))].map(n=>({n,...cmpEx(n,a1,b1,a0,b0)})),u=exs.filter(x=>x.v=='up').length,d=exs.filter(x=>x.v=='down').length,f=exs.filter(x=>x.v=='flat').length;let v,why;
if(!c.length&&!p.length){v='nodata';why='No sets in either month.'}else if(!c.length){v='down';why=`Not trained this month (previous month: ${p.length} sets).`;sug.push(`${m}: zero sets logged — train it at least twice a week.`)}else if(u+d+f==0){v='insuf';why='Not enough repeated sessions of the same lift in both months to judge strength. Volume and frequency below are still real counts.'}else if(u>d){v='up';why=`${u} lift(s) improved, ${d} regressed, ${f} flat.`}else if(d>u){v='down';why=`${d} lift(s) regressed, ${u} improved, ${f} flat.`}else if(u&&u==d){v='flat';why='Mixed: equal numbers improved and regressed.'}else{v='flat';why=`${f} lift(s) show no meaningful change (±1% est. 1RM).`}
if(c.length){if(dc/w1<1.5)sug.push(`${m}: ${n1(dc/w1)} sessions/week — add a second weekly session.`);if(c.length/w1<10)sug.push(`${m}: ${n1(c.length/w1)} sets/week — below the common 10+ sets/week guideline (a guideline, not a rule).`);if(v=='flat')sug.push(`${m}: strength flat — add a rep or small load to your top sets before adding volume.`);if(v=='down')sug.push(`${m}: performance fell — repeat last month's best loads and check sleep/recovery.`);if(v=='up')sug.push(`${m}: progressing — keep the same lifts and progress them.`)}
return `<div class="card"><div class="row sp"><h3 style="font-size:18px">${m}</h3><span class="tag ${v}">${VL[v]}</span></div><p class="m" style="margin:6px 0">${why}</p><div class="m">Sets: <b style="color:var(--t)">${c.length}</b> (${n1(c.length/w1)}/wk) vs ${p.length} (${n1(p.length/w0)}/wk)${pc(c.length/w1,p.length/w0)}<br>Training days: ${dc} (${n1(dc/w1)}/wk) vs ${dp} (${n1(dp/w0)}/wk)<br>Volume: ${sw(vol(c))} vs ${sw(vol(p))}${pc(vol(c)/w1,vol(p)/w0)}</div>${exs.map(x=>`<div class="ex" style="padding:8px 0"><div class="row sp"><b>${esc(x.n)}</b><span class="tag ${x.v}">${VL[x.v]}</span></div><div class="m">${x.t}</div></div>`).join('')}</div>`}),
bw=D.bw.filter(x=>inR(x.date,a1,b1)),pd_=sum(D.pr.filter(x=>inR(x.date,a1,b1)),x=>x.date,x=>x.g),ph=PH.filter(p=>inR(p.date,a1,b1));
if(c1<D.set.goal&&b1==e)sug.push(`Only ${c1} workout days vs your goal of ${D.set.goal}. Schedule fixed training days.`);if(pd_.length&&pd_.filter(x=>x.y>=D.set.pt).length/pd_.length<.7)sug.push('Protein target hit on under 70% of logged days — plan a repeatable high-protein meal.');if(ph.length<Math.floor(w1)-1)sug.push(`Only ${ph.length} progress photo(s) — aim for one per week.`);
return `<div class="card hero"><h2>${mname(M)} · ${a1.slice(5)} to ${b1.slice(5)}${b1<e?' (month in progress)':''}</h2><div class="g3"><div class="tile"><b>${c1}</b><span class="m">workout days (prev ${c0})</span></div><div class="tile"><b>${n1(c1/w1)}</b><span class="m">per week (prev ${n1(c0/w0)})</span></div><div class="tile"><b>${n1(c1/D.set.goal*100)}%</b><span class="m">of ${D.set.goal}-day goal</span></div></div>
<p class="m" style="margin-top:10px">${c1<c0?`<b class="down">Consistency dropped</b> — ${c1} workout days vs ${c0}.`:c1==c0?'Same number of workout days as last month.':`Consistency up — ${c1} workout days vs ${c0}.`} A workout day = 3+ completed sets. Comparisons use per-week averages so partial months stay fair.</p></div>${mgs.join('')}
<div class="card"><h3>Bodyweight</h3><p class="m">${bw.length>1?`${sb(bw[0].v)} (${bw[0].date.slice(5)}) → ${sb(bw.slice(-1)[0].v)} (${bw.slice(-1)[0].date.slice(5)}): <b style="color:var(--t)">${bw.slice(-1)[0].v-bw[0].v>=0?'+':''}${n1(ub(bw.slice(-1)[0].v-bw[0].v))} ${D.set.bw}</b> from ${bw.length} entries. Whether this is good depends on your goal.`:'Insufficient data — need 2+ entries this month.'}</p></div>
<div class="card"><h3>Protein</h3><p class="m">${pd_.length?`Logged on ${pd_.length} days; target of ${D.set.pt}g hit on ${pd_.filter(x=>x.y>=D.set.pt).length}. Average on logged days: ${Math.round(pd_.reduce((t,x)=>t+x.y,0)/pd_.length)}g.`:'No protein entries this month.'}</p></div>
<div class="card"><h3>Progress photos</h3><p class="m">${ph.length>1?`${ph.length} photos (${dl(ph[0].date)} → ${dl(ph.slice(-1)[0].date)}). Visual comparison only — no measurements are inferred.`:ph.length?'Only 1 photo this month — cannot compare.':'No photos this month.'}</p>${ph.length>1?`<button class="btn" onclick="cA='${ph[0].id}';cB='${ph.slice(-1)[0].id}';go('ph')">Compare first vs last</button>`:''}</div>
<div class="card"><h3>Next month</h3>${sug.map(s=>`<div class="ex" style="padding:8px 0">${esc(s)}</div>`).join('')||'<p class="m">No red flags in the data. Keep logging.</p>'}</div>
<p class="m">How to read this: “Improved/Regressed” compares your best est. 1RM (Epley) for each lift between months, needing 2+ sessions of that lift in both months and a change beyond ±1%. Anything else is marked Insufficient or No data — never guessed.</p>`}
/* ---------- SETTINGS ---------- */
function vSet(){const s=D.set;return `<h1 style="margin-bottom:12px">Settings</h1><div class="card"><div class="g2"><label class="m">Bodyweight unit<select onchange="D.set.bw=this.value;save();render()">${opt(['kg','lbs'],s.bw)}</select></label><label class="m">Weight unit<select onchange="D.set.wu=this.value;save();render()">${opt(['kg','lbs'],s.wu)}</select></label><label class="m">Daily protein (g)<input type="number" value="${s.pt}" onchange="D.set.pt=Math.min(500,Math.max(10,+this.value||150));save();render()"></label><label class="m">Theme<select onchange="D.set.th=this.value;save();render()">${opt(['Dark','OLED black'],s.th=='OLED black'?s.th:'Dark')}</select></label></div></div>
<div class="card"><h2>Streak rules</h2><p class="m">A day counts when you complete 3+ sets. Your streak survives up to <b style="color:var(--t)">${s.rest}</b> consecutive rest days between workouts; a longer gap resets it to 0.</p><select onchange="D.set.rest=+this.value;save();render()" style="margin-top:8px">${[0,1,2,3].map(n=>`<option value="${n}" ${n==s.rest?'selected':''}>${n} rest day${n==1?'':'s'} allowed</option>`).join('')}</select></div>
<div class="card"><h2>Workout reminder</h2><div class="row"><input type="time" value="${s.rem}" onchange="D.set.rem=this.value;save()"><button class="btn gh ${s.remOn?'on':''}" onclick="remT()">${s.remOn?'On':'Off'}</button></div><p class="m" style="margin-top:8px">Reminders fire only while the app is open — an offline file app cannot send background push notifications.</p></div>
<div class="card"><h2>Your data (stored on this device)</h2><div class="row w"><button class="btn" onclick="exp()">Export backup</button><button class="btn gh" onclick="$('#im').click()">Import backup</button><input id="im" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div><p class="m" style="margin-top:8px">Backups include workouts, bodyweight, protein, settings and photos. Clearing browser data deletes everything, so export regularly.</p>
<div class="row w" style="margin-top:12px"><button class="btn gh" onclick="if(confirm('Delete ALL workouts, body and protein data? Photos are kept.')&&confirm('This cannot be undone. Continue?')){D={set:D.set,rt:[],ss:[],bw:[],pr:[],best:0,seen:{}};save();render()}">Reset logs</button><button class="btn gh" onclick="if(confirm('Delete ALL photos?')&&confirm('This cannot be undone. Continue?'))wipePh()">Delete photos</button></div></div>`}
async function wipePh(){for(const p of PH)await tx('readwrite',s=>s.delete(p.id));PH=[];cA=cB=null;render()}
function exp(){const b=new Blob([JSON.stringify({app:'forge',v:1,data:D,photos:PH})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='forge-backup-'+todayS()+'.json';a.click();toast('Backup downloaded')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(o.app!='forge'||!o.data)throw 0;if(!confirm('Replace ALL current data with this backup?'))return;D=Object.assign({set:{},rt:[],ss:[],bw:[],pr:[],best:0,seen:{}},o.data);D.set=Object.assign({},DEF,D.set);save();await wipePh();for(const p of o.photos||[])await tx('readwrite',s=>s.put(p));PH=(o.photos||[]).sort((a,b)=>a.date<b.date?-1:1);toast('Backup restored');render()}catch(e){toast('That file is not a valid FORGE backup')}};r.readAsText(f)}
async function remT(){if(!D.set.remOn){if(!('Notification' in window))return toast('Notifications unsupported here');if(await Notification.requestPermission()!='granted')return toast('Permission denied')}D.set.remOn=!D.set.remOn;save();render()}
setInterval(()=>{const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(D.set.remOn&&t==D.set.rem&&!WD().has(todayS())&&localStorage.getItem('forge.rem')!=todayS()){localStorage.setItem('forge.rem',todayS());try{new Notification('FORGE',{body:'Time to train. Keep the streak alive.'})}catch(e){}}},30000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();idb().then(()=>tx('readonly',s=>s.getAll())).then(a=>{PH=(a||[]).sort((x,y)=>x.date<y.date?-1:1)}).catch(()=>{pherr=true}).finally(()=>{ready=true;render()});
</script></body></html>
